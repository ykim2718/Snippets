<!DOCTYPE html>
<html>
<head>
<style>
  .fraction-badge {
    background-color: #005A9C;
    border-radius: 8px;
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    padding: 6px 0;
    min-width: 45px;
    color: white;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 50px;
  }
  .numerator {
    font-size: 1em;;
  }
  .slash {
    font-size: 0.7em;
    margin: 0 1px;
    opacity: 0.8;
  }
  .denominator {
    font-size: 0.7em;
  }
</style>
</head>
<body>

<div class="fraction-badge">
  <span class="numerator">1</span>
  <span class="slash">/</span>
  <span class="denominator">6</span>
</div>

</body>
</html>
